<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>시간표</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
            background-color: #ffffff;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        td {
            height: 60px;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #e6f2ff;
        }
    </style>
</head>
<body>

    <h1>나의 시간표</h1>

    <table>

            <th>금요일</th>
        </tr>

            <td>영어</td>
            <td>과학</td>
            <td>사회</td>
        </tr>

        <tr>
            <td>2교시</td>
            <td>수학</td>
            <td>영어</td>

        </tr>

        <tr>

        <tr>

            <td>수학</td>

        </tr>

        <tr>
            <td>5교시</td>

        <tr>

        </tr>
    </table>

</body>
</html>
